# CURATED COMMAND/OUT SELECTIONS
#
# Forces a specific OnBase/Control + Outs combination for a player's card in the given sets,
# instead of the bot's most accurate chart. Only applied when the card covers the player's
# full season (no partial date ranges, splits, postseason, etc.), so in-season trends only
# pick it up on the final full-range datapoint.
#
# FIELDS
#   key:          Stable unique id for the entry. Keep it when editing the combo.
#   player_id:    Baseball Reference id, or "mlb{mlb_id}" for players without one.
#   year:         Exact year string of the card (quote it, e.g. "2026").
#   sets:         Sets the selection applies to (quote them, e.g. ["2004", "2005"]).
#   command:      OnBase (hitters) or Control (pitchers).
#   outs:         Outs as shown on the card.
#   player_type:  Optional. HITTER or PITCHER, for two-way players.
#   added_in:     Bot version the entry was added/last changed in.
#   note:         Why the combo was chosen.
#
# Editing an entry changes its fingerprint, which flags stored cards built with the old values as stale.

# ---------------------------------
# Colson Montgomery 2026
# ---------------------------------
- key: montgco01-2026-00-01
  player_id: montgco01
  year: "2026"
  sets: ["2000", "2001"]
  command: 9
  outs: 9
  added_in: "4.5"
  note: 9 Onbase / 9 Out chart matches his OPS and helps get closer to his strikeout total.
- key: montgco01-2026-04-05-EXP
  player_id: montgco01
  year: "2026"
  sets: ["2004", "2005", "EXPANDED"]
  command: 12
  outs: 11
  added_in: "4.5"
  note: 12 Onbase / 11 Out chart helps get closer to his strikeout total, and is similar OPS accuracy vs the original 8 OB / 5 Out chart

