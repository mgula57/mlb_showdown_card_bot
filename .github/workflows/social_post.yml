name: Social Card Post

on:
  # Cron is UTC and ignores DST. Times below are 9am / 1pm / 6pm Central in winter (CST, UTC-6)
  # and shift to 10am / 2pm / 7pm in summer (CDT, UTC-5). Off the hour to dodge the :00 queue rush.
  schedule:
    - cron: "7 15 * * *"
    - cron: "7 19 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pick card + build caption, don't post or log)"
        type: boolean
        default: true

# Never let two posts overlap (e.g. a delayed scheduled run and a manual run).
concurrency:
  group: social-card-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_URL_ARCHIVE: ${{ secrets.DATABASE_URL_ARCHIVE }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      SHOWDOWN_SITE_URL: ${{ vars.SHOWDOWN_SITE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/social/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/social/requirements.txt

      # Scheduled runs always post; manual runs post only when dry_run is unchecked.
      - name: Post random card
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/social/post_card.py --env prod
          else
            python scripts/social/post_card.py --env prod --live
          fi
