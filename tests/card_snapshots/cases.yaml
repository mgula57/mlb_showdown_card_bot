# CARD SNAPSHOT CASES
#
# Real players whose cards are guarded by `tests/test_card_snapshots.py`. Each case is rebuilt in every Set.
# `kwargs` are passed straight to `generate_card()` by `capture_fixtures.py` (run once, locally, with DB access)
# to capture the card's inputs into `fixtures/<id>.json`. Tests run offline from those fixtures.
#
# To add a case: append it here, run `python tests/card_snapshots/capture_fixtures.py --missing`,
# then `pytest tests/test_card_snapshots.py --update-snapshots` and commit the new fixture + snapshot.

